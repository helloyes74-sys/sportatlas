# Holt Schriften (Archivo, JetBrains Mono) und MapLibre GL einmalig aus npm und legt sie unter app/vendor/ ab,
# damit die App keine Google-Fonts- und unpkg-Anfragen mehr braucht (Datenschutz: keine IP an Dritte).
# Manuell starten, z. B. nach einem Versionswechsel von MapLibre.
name: Bibliotheken lokal ablegen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pakete laden
        run: |
          set -e
          mkdir -p /tmp/p && cd /tmp/p
          npm pack -q @fontsource-variable/archivo@5 @fontsource/jetbrains-mono@5 maplibre-gl@5.6.0
          for f in *.tgz; do mkdir -p "${f%.tgz}"; tar xzf "$f" -C "${f%.tgz}"; done
          ls
      - name: Ablegen
        run: |
          set -e
          V=app/vendor; rm -rf $V; mkdir -p $V/fonts $V/maplibre
          A=$(ls -d /tmp/p/fontsource-variable-archivo-*/package)
          J=$(ls -d /tmp/p/fontsource-jetbrains-mono-*/package)
          M=$(ls -d /tmp/p/maplibre-gl-*/package)
          cp $M/dist/maplibre-gl.js $M/dist/maplibre-gl.css $V/maplibre/
          cp $M/LICENSE.txt $V/maplibre/LICENSE.txt 2>/dev/null || cp $M/LICENSE* $V/maplibre/ || true
          # Archivo mit Breiten- und Gewichtsachse (wdth.css), JetBrains Mono 400 und 500; nur latin + latin-ext
          node -e '
            const fs = require("fs"), path = require("path");
            const [A, J, out] = process.argv.slice(1);
            let css = "/* Lokal abgelegt aus @fontsource (SIL Open Font License), siehe Workflow vendor.yml */\n";
            const take = (dir, file, family) => {
              const src = fs.readFileSync(path.join(dir, file), "utf8");
              for (const block of src.match(/\/\*[^*]*\*\/\s*@font-face\s*{[^}]*}/g) || []) {
                if (!/\/\*\s*[\w-]+-(latin|latin-ext)-/.test(block)) continue;
                const f = block.match(/url\(\.\/files\/([^)]+\.woff2)\)/)[1];
                fs.copyFileSync(path.join(dir, "files", f), path.join(out, f));
                css += block.replace(/font-family:\s*[^;]+;/, `font-family: "${family}";`).replace(/url\(\.\/files\//g, "url(./") + "\n";
              }
            };
            take(A, "wdth.css", "Archivo");
            take(J, "400.css", "JetBrains Mono");
            take(J, "500.css", "JetBrains Mono");
            fs.writeFileSync(path.join(out, "fonts.css"), css);
          ' "$A" "$J" $V/fonts
          cp $A/LICENSE $V/fonts/OFL-Archivo.txt 2>/dev/null || true
          cp $J/LICENSE $V/fonts/OFL-JetBrainsMono.txt 2>/dev/null || true
          ls -la $V/fonts $V/maplibre
          test -s $V/maplibre/maplibre-gl.js
          test $(ls $V/fonts/*.woff2 | wc -l) -ge 4
      - name: Festschreiben
        run: |
          git config user.name "sportatlas-daten"
          git config user.email "helloyes74-sys@users.noreply.github.com"
          git add app/vendor
          if git diff --cached --quiet; then echo "Keine Änderungen."; exit 0; fi
          git commit -m "Schriften und MapLibre lokal abgelegt (app/vendor)"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 10; done; exit 1
