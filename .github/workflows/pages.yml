# Die App ist NICHT öffentlich (Wunsch Thomas, 31.10.2026): veröffentlicht wird nur offline/ – eine leere
# Seite, die alte Service-Worker-Caches auf Geräten löscht. Zum Wiederveröffentlichen path: app setzen.
name: Sportatlas auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: offline
      - id: deployment
        uses: actions/deploy-pages@v4
